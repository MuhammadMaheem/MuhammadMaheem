name: Commit heartbeat

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 05:17 PKT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-writer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render heartbeat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/heartbeat.py "${{ github.repository_owner }}"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heartbeat.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(heartbeat): refresh commit pulse"
          git pull --rebase
          git push
